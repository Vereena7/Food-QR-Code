      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.value = 0.15;
      o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 140);
    }catch(e){}
  }

  function setBanner(text, cls){
    banner.textContent = text;
    banner.className = cls || '';
  }

  
  function callApi(params, cb){
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const timeout = setTimeout(() => {
      if (window[cbName]){ delete window[cbName]; cb({ ok:false, error:'timeout' }); cleanup(); }
    }, 8000);
    function cleanup(){
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(data){
      clearTimeout(timeout);
      delete window[cbName];
      cleanup();
      cb(data);
    };
    const qs = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
    const script = document.createElement('script');
    script.src = EXEC_URL + '?' + qs + '&callback=' + cbName;
    script.onerror = function(){
      clearTimeout(timeout);
      if (window[cbName]) delete window[cbName];
      cleanup();
      cb({ ok:false, error:'network' });
    };
    document.body.appendChild(script);
  }

  function checkConnection(){
    callApi({ action:'ping', secret:SECRET }, function(res){
      document.getElementById('pingStatus').textContent = (res && res.ok) ? '✅ متصل وكود الأمان صح' : '❌ في مشكلة اتصال أو كود الأمان غلط';
    });
  }
  checkConnection();

  function extractId(decodedText){
    const m = decodedText.match(/[?&]id=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : decodedText.trim();
  }

  
  
  function showConfirmGate(){
    awaitingConfirm = true;
    try { html5QrCode.pause(true); } catch (e) {}
    nextBtn.style.display = 'block';
  }

  function goToNext(){
    awaitingConfirm = false;
    lastId = null;
    nextBtn.style.display = 'none';
    setBanner('وجّه الكاميرا على كود الشخص اللي بعده...', '');
    try { html5QrCode.resume(); } catch (e) {}
  }
  nextBtn.addEventListener('click', goToNext);

  function onScanSuccess(decodedText){
    if (busy || awaitingConfirm) return;
    const id = extractId(decodedText);
    const now = Date.now();
    if (id === lastId && (now - lastTime) < 4000) return; 
    lastId = id; lastTime = now;
    busy = true;
    setBanner('⏳ بيسجّل...', '');
    callApi({ action:'scan', id:id, secret:SECRET }, function(res){
      busy = false;
      if (res && res.ok){
        if (res.alreadyDone){
          setBanner('⚠️ ' + res.name + ' — استلم قبل كده', 'warn');
        } else {
          successCount++;
          counterEl.textContent = 'تم تسجيل ' + successCount + ' من بداية فتح الصفحة';
          setBanner('✅ ' + res.name + ' — اتسجل', 'ok');
        }
      } else {
        setBanner('❌ خطأ: ' + ((res && res.error) || 'غير معروف'), 'err');
      }
      beep();
      if (navigator.vibrate) navigator.vibrate(120);
      showConfirmGate();
    });
  }

  const html5QrCode = new Html5Qrcode('reader');
  Html5Qrcode.getCameras().then(function(cameras){
    let cameraId = cameras && cameras.length ? cameras[cameras.length - 1].id : null; 
    
    
    
    
    const videoConstraints = { width: { ideal: 1920 }, height: { ideal: 1920 }, aspectRatio: { ideal: 1 } };
    if (cameraId) videoConstraints.deviceId = { exact: cameraId };
    else videoConstraints.facingMode = 'environment';
    
    
    
    
    const SCAN_BOX_RATIO = 0.7;
    const qrbox = function (viewfinderWidth, viewfinderHeight) {
      const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
      const size = Math.floor(minEdge * SCAN_BOX_RATIO);
      return { width: size, height: size };
    };
    const config = { fps: 10, qrbox: qrbox, videoConstraints: videoConstraints };
    const target = cameraId ? cameraId : { facingMode: 'environment' };
    html5QrCode.start(target, config, onScanSuccess).then(function(){
      
      
      
      
      startFitVideoLoop();
      window.addEventListener('resize', fitVideoToBox);
      window.addEventListener('orientationchange', function(){ startFitVideoLoop(); });
      const v = document.querySelector('#reader video');
      if (v) {
        v.addEventListener('loadedmetadata', fitVideoToBox);
        v.addEventListener('playing', fitVideoToBox);
        v.addEventListener('resize', fitVideoToBox);
      }
      
      
      const box = document.getElementById('reader');
      if (box && window.MutationObserver) {
        new MutationObserver(fitVideoToBox).observe(box, {
          childList: true, subtree: true, attributes: true, attributeFilter: ['style']
        });
      }
    }).catch(function(err){
      setBanner('❌ مقدرش أفتح الكاميرا: ' + err, 'err');
    });
  }).catch(function(err){
    setBanner('❌ مقدرش أوصل لكاميرات الجهاز: ' + err, 'err');
  });

  function fitVideoToBox(){
    const box = document.getElementById('reader');
    const video = box ? box.querySelector('video') : null;
    if (!box || !video) return;
    const w = box.clientWidth, h = box.clientHeight;
    if (!w || !h) return;
    const targetW = w + 'px', targetH = h + 'px';
    
    
    if (video.style.width === targetW && video.style.height === targetH
        && video.style.objectFit === 'cover') {
      return;
    }
    video.style.setProperty('width', targetW, 'important');
    video.style.setProperty('height', targetH, 'important');
    video.style.setProperty('object-fit', 'cover', 'important');
  }

  
  
  function startFitVideoLoop(){
    fitVideoToBox();
    const delays = [100, 250, 500, 1000, 2000, 3500, 6000];
    delays.forEach(function(d){ setTimeout(fitVideoToBox, d); });
  }
</script>
