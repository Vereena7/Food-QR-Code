  #setupBox{
    width:100%; max-width:440px; margin-top:14px; background:#1e293b; border-radius:14px;
    padding:14px 16px; font-size:13px; line-height:1.9; color:#cbd5e1; display:none;
  }
  #setupBox.show{display:block;}
  #setupBox b{color:#fff;}
  .toggle-link{margin-top:10px; font-size:12.5px; color:#cbd5e1; cursor:pointer; text-decoration:underline; text-shadow:0 1px 5px rgba(0,0,0,.8);}
</style>
</head>
<body>
  <h1>🍽️ استلام الوجبات والآيس كريم</h1>
  <div id="camWrap"><div id="reader"></div></div>
  <div id="resultBanner">وجّه الكاميرا على كود الشخص...</div>
  <div id="counter">تم تسجيل 0 من بداية فتح الصفحة</div>
  <div class="toggle-link" id="toggleSetup">إعدادات الاتصال</div>
  <div id="setupBox">
    <div>رابط المشروع: <b id="showUrl"></b></div>
    <div>حالة الاتصال: <b id="pingStatus">بيتفحص...</b></div>
  </div>

<script>
  const EXEC_URL = 'https://script.google.com/macros/s/AKfycbzoZft-U9ZP-4OHuukMVoJz8y2D2jfQPoo4n5L5jyzTYm-RAJMcYhhHYz1JgtDO-bj2Fw/exec';
  const SECRET = 'c09091d8b70e41149479dfa5cb769406';

  const banner = document.getElementById('resultBanner');
  const counterEl = document.getElementById('counter');
  let successCount = 0;
  let lastId = null, lastTime = 0;
  let busy = false;

  document.getElementById('showUrl').textContent = EXEC_URL;
  document.getElementById('toggleSetup').addEventListener('click', () => {
    document.getElementById('setupBox').classList.toggle('show');
  });

  function beep(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.value = 0.15;
      o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 140);
    }catch(e){}
  }

  function setBanner(text, cls){
    banner.textContent = text;
    banner.className = cls || '';
  }

  
  function callApi(params, cb){
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const timeout = setTimeout(() => {
      if (window[cbName]){ delete window[cbName]; cb({ ok:false, error:'timeout' }); cleanup(); }
    }, 8000);
    function cleanup(){
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(data){
      clearTimeout(timeout);
      delete window[cbName];
      cleanup();
      cb(data);
    };
    const qs = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
    const script = document.createElement('script');
    script.src = EXEC_URL + '?' + qs + '&callback=' + cbName;
    script.onerror = function(){
      clearTimeout(timeout);
      if (window[cbName]) delete window[cbName];
      cleanup();
      cb({ ok:false, error:'network' });
    };
    document.body.appendChild(script);
  }

  function checkConnection(){
    callApi({ action:'ping', secret:SECRET }, function(res){
      document.getElementById('pingStatus').textContent = (res && res.ok) ? '✅ متصل وكود الأمان صح' : '❌ في مشكلة اتصال أو كود الأمان غلط';
    });
  }
  checkConnection();

  function extractId(decodedText){
    const m = decodedText.match(/[?&]id=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : decodedText.trim();
  }

  function onScanSuccess(decodedText){
    const id = extractId(decodedText);
    const now = Date.now();
    if (busy) return;
    if (id === lastId && (now - lastTime) < 4000) return; 
    lastId = id; lastTime = now;
    busy = true;
    setBanner('⏳ بيسجّل...', '');
    callApi({ action:'scan', id:id, secret:SECRET }, function(res){
      busy = false;
      if (res && res.ok){
        if (res.alreadyDone){
          setBanner('⚠️ ' + res.name + ' — استلم قبل كده', 'warn');
        } else {
          successCount++;
          counterEl.textContent = 'تم تسجيل ' + successCount + ' من بداية فتح الصفحة';
          setBanner('✅ ' + res.name + ' — اتسجل', 'ok');
        }
        beep();
        if (navigator.vibrate) navigator.vibrate(120);
      } else {
        setBanner('❌ خطأ: ' + ((res && res.error) || 'غير معروف'), 'err');
      }
    });
  }

  const html5QrCode = new Html5Qrcode('reader');
  Html5Qrcode.getCameras().then(function(cameras){
    let cameraId = cameras && cameras.length ? cameras[cameras.length - 1].id : null; 
    const config = { fps: 10 };
    const target = cameraId ? cameraId : { facingMode: 'environment' };
    html5QrCode.start(target, config, onScanSuccess).catch(function(err){
      setBanner('❌ مقدرش أفتح الكاميرا: ' + err, 'err');
    });
  }).catch(function(err){
    setBanner('❌ مقدرش أوصل لكاميرات الجهاز: ' + err, 'err');
  });
</script>
</body>
</html>
